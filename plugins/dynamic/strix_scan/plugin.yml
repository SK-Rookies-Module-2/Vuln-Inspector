id: "dynamic_strix_scan"
name: "Strix External Dynamic Scan"
version: "0.1.0"
type: "dynamic"
category: "external"
tags:
  - "STRIX"
description: "External dynamic scan placeholder for Strix integration."
config_schema:
  properties:
    base_url:
      type: string
    auth_headers:
      type: object
      default: {}
    scan_mode:
      type: string
      enum: ["quick", "standard", "deep"]
    instruction:
      type: string
    instruction_file:
      type: string
    non_interactive:
      type: boolean
      default: true
    run_name:
      type: string
    timeout:
      type: integer
      default: 1800
      min: 1
entry_point: "main.py"
class_name: "StrixDynamicScan"
